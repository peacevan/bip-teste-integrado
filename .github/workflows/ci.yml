name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Build and test EJB module first (dependency)
      - name: Build and test EJB module
        run: mvn -B -f ejb-module clean install
      
      # Build and test Spring Boot backend module
      - name: Build and test backend module
        run: mvn -B -f backend-module clean package
      
      # Optional: Run integration tests if they exist
      - name: Run integration tests
        run: |
          if [ -f "integration-tests/pom.xml" ]; then
            mvn -B -f integration-tests clean test
          fi
