<mat-card>
  <mat-card-header>
    <mat-card-title>Lista de Benefícios</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Barra de Busca e Ações -->
    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar por nome</mat-label>
        <input matInput
               [(ngModel)]="searchTerm"
               (keyup.enter)="searchBeneficios()"
               placeholder="Digite o nome do benefício">
        <button mat-icon-button
                matSuffix
                (click)="searchBeneficios()"
                [disabled]="loading">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button
              color="primary"
              (click)="onCreate()"
              [disabled]="loading">
        <mat-icon>add</mat-icon>
        Novo Benefício
      </button>

      <button mat-raised-button
              color="accent"
              (click)="loadBeneficios()"
              [disabled]="loading">
        <mat-icon>refresh</mat-icon>
        Atualizar
      </button>
    </div>

    <!-- Tabela de Benefícios -->
    <div class="table-container">
      <table mat-table [dataSource]="beneficios" class="mat-elevation-z8">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let beneficio">{{beneficio.id}}</td>
        </ng-container>

        <!-- Nome Column -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let beneficio">{{beneficio.nome}}</td>
        </ng-container>

        <!-- Descrição Column -->
        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let beneficio">{{beneficio.descricao || '-'}}</td>
        </ng-container>

        <!-- Valor Column -->
        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td mat-cell *matCellDef="let beneficio">
            <span class="valor">R$ {{beneficio.valor | number:'1.2-2'}}</span>
          </td>
        </ng-container>

        <!-- Ativo Column -->
        <ng-container matColumnDef="ativo">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let beneficio">
            <span [class]="beneficio.ativo ? 'status-ativo' : 'status-inativo'">
              {{beneficio.ativo ? 'Ativo' : 'Inativo'}}
            </span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let beneficio">
            <button mat-icon-button
                    color="primary"
                    matTooltip="Editar"
                    (click)="onEdit(beneficio.id!)"
                    [disabled]="loading">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button
                    color="accent"
                    matTooltip="Transferir"
                    (click)="onTransfer(beneficio.id!)"
                    [disabled]="loading">
              <mat-icon>swap_horiz</mat-icon>
            </button>
            <button mat-icon-button
                    color="warn"
                    matTooltip="Excluir"
                    (click)="deleteBeneficio(beneficio.id!)"
                    [disabled]="loading">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Loading State -->
      <div *ngIf="loading" class="loading-container">
        <p>Carregando benefícios...</p>
      </div>

      <!-- Empty State -->
      <div *ngIf="!loading && beneficios.length === 0" class="empty-container">
        <mat-icon>inbox</mat-icon>
        <p>Nenhum benefício encontrado</p>
      </div>
    </div>
  </mat-card-content>
</mat-card>
